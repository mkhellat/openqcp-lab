name: paulikit wheels

# Per tools/paulikit/PLAN.md Phase 5: builds paulikit's wheels (with
# the native extension always included) so a future hard-require of
# the compiled fast path is viable without demanding a C++ toolchain +
# oneTBB from every user. Manual/tag-triggered only, not on every push
# - see PLAN.md Phase 5, item 2.

on:
  push:
    tags:
      - "paulikit-v*"
  workflow_dispatch: {}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: tools/paulikit
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: paulikit-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
