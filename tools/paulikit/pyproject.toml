[build-system]
requires = ["meson-python>=0.16", "Cython>=3.0", "numpy>=1.24"]
build-backend = "mesonpy"

[project]
name = "paulikit"
version = "0.1.0"
description = "Performance-engineering tools for Pauli decomposition of Hermitian operators"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "Mohammadreza Khellat", email = "mkhellat@beavernets.com" },
]
keywords = [
    "quantum-computing",
    "pauli-decomposition",
    "hamiltonian-simulation",
    "performance-engineering",
    "walsh-hadamard-transform",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pennylane>=0.35",
]
dev = [
    "pytest>=7",
    "pennylane>=0.35",
    "snakeviz",
    "line_profiler",
    "py-spy",
    "cython>=3.0",
    "cffi>=1.16",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser>=2",
    "sphinx-autodoc-typehints>=2",
]

[project.urls]
Homepage = "https://codeberg.org/mkhellat/openqcp-lab"
Repository = "https://codeberg.org/mkhellat/openqcp-lab"
"Plan / research notes" = "https://codeberg.org/mkhellat/openqcp-lab/src/branch/main/tools/paulikit/PLAN.md"

[project.scripts]
paulikit = "paulikit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: benchmark/reference comparisons that take minutes to run; excluded by default (see Makefile's `test` target, which passes -m 'not slow')",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
