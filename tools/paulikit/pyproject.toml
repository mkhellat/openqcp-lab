[build-system]
requires = ["meson-python>=0.16", "Cython>=3.0", "numpy>=1.24"]
build-backend = "mesonpy"

[project]
name = "paulikit"
version = "0.1.0"
description = "Performance-engineering tools for Pauli decomposition of Hermitian operators"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "Mohammadreza Khellat", email = "mkhellat@beavernets.com" },
]
keywords = [
    "quantum-computing",
    "pauli-decomposition",
    "hamiltonian-simulation",
    "performance-engineering",
    "walsh-hadamard-transform",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
sparse = [
    "scipy>=1.10",
]
test = [
    "pytest>=7",
    "pennylane>=0.35",
    "scipy>=1.10",
]
dev = [
    "pytest>=7",
    "pennylane>=0.35",
    "scipy>=1.10",
    "snakeviz",
    "line_profiler",
    "py-spy",
    "cython>=3.0",
    "cffi>=1.16",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser>=2",
    "sphinx-autodoc-typehints>=2",
]

[project.urls]
Homepage = "https://codeberg.org/mkhellat/openqcp-lab"
Repository = "https://codeberg.org/mkhellat/openqcp-lab"
"Plan / research notes" = "https://codeberg.org/mkhellat/openqcp-lab/src/branch/main/tools/paulikit/PLAN.md"

[project.scripts]
paulikit = "paulikit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: benchmark/reference comparisons that take minutes to run; excluded by default (see Makefile's `test` target, which passes -m 'not slow')",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.cibuildwheel]
# Phase 5 (PLAN.md): build wheels with the native extension always
# included, so paulikit's compiled fast path stops being an opt-in
# users have to know to ask for. Only x86_64 targeted for now (see
# PLAN.md Phase 5's "explicitly out of scope": no aarch64/ARM, no
# free-threaded builds yet).
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *_i686"
archs = ["auto64"]
test-requires = ["pytest>=7"]
test-command = "pytest {package}/tests -m 'not slow'"
# The native extension must actually be present in the wheel, not
# silently fall back - a wheel that "succeeds" but built without the
# extension would be a worse regression than today's honest
# optional-fallback source-build model (see PLAN.md Phase 5, item 3).
before-test = "python -c \"from paulikit._native import pauli_label_native\""

[tool.cibuildwheel.linux]
# oneTBB isn't in the manylinux_2_28 (AlmaLinux 8) base image; install
# it via dnf before the build starts. tbb-devel provides both the
# shared library and the pkg-config file meson's dependency('tbb')
# looks for first.
before-all = "dnf install -y tbb-devel"

[tool.cibuildwheel.macos]
# Homebrew's tbb formula's pkg-config support is not confirmed as of
# writing (see PLAN.md Phase 5) - CMAKE_PREFIX_PATH is set as a
# fallback for meson's dependency() call, which tries pkg-config then
# CMake config files. UNVERIFIED: this whole section is a first
# attempt, not yet validated by an actual CI run - expect to iterate
# once real macOS runner output is available.
before-all = "brew install tbb"
environment = { CMAKE_PREFIX_PATH = "/opt/homebrew:/usr/local", PKG_CONFIG_PATH = "/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" }

[tool.cibuildwheel.windows]
# vcpkg's tbb port ships CMake config files under lib/cmake/TBB (no
# confirmed pkg-config support), so CMAKE_PREFIX_PATH is the load-
# bearing variable here, not PKG_CONFIG_PATH. UNVERIFIED, same caveat
# as macOS above - vcpkg's install location and exact triplet may need
# adjustment once this actually runs in CI.
before-all = "vcpkg install tbb:x64-windows"
environment = { CMAKE_PREFIX_PATH = "C:\\vcpkg\\installed\\x64-windows" }
